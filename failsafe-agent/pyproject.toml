[tool.poetry]
name = "failsafe-agent"
version = "0.1.0"
description = "A resilient and fault-tolerant agent framework"
authors = ["Simranjeet Singh <simranjeet@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
redis = "^5.0.3"
asyncpg = "^0.29.0"
structlog = "^24.1.0"
pydantic-settings = "^2.2.1"
stripe = "^8.5.0"
scikit-learn = "^1.4.0"
langgraph = "^0.0.30"
presidio-analyzer = "^2.2.353"
presidio-anonymizer = "^2.2.353"
opentelemetry-sdk = "^1.24.0"
opentelemetry-api = "^1.24.0"
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
pytest-asyncio = "^0.23.5"
freezegun = "^1.4.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
