<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VentureMind — Multi-Agent Due Diligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --dim: #484f58;
      --accent: #a371f7; --green: #3fb950; --red: #f85149;
      --amber: #d29922; --blue: #58a6ff; --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .header { padding: 14px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header h1 span { color: var(--accent); }
    .health-pill { padding: 5px 14px; border-radius: 999px; background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.2); font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 6px; }
    .health-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(63,185,80,0.5); }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px; flex: 1; }

    /* 2 col: sidebar + main */
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; min-height: calc(100vh - 80px); }

    /* Sidebar */
    .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin-bottom: 10px; }
    .reports-list { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 180px); overflow-y: auto; }
    .rpt-item { padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; }
    .rpt-item:hover { background: rgba(255,255,255,0.03); border-color: var(--border); }
    .rpt-item.active { background: rgba(163,113,247,0.08); border-color: rgba(163,113,247,0.3); }
    .rpt-score { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; }
    .card-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 18px; }

    /* Search */
    .search-row { display: flex; gap: 10px; }
    .search-input { flex: 1; height: 44px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0 14px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #9366e0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress */
    .progress-bar { display: flex; gap: 8px; margin-top: 14px; }
    .agent-pill { flex: 1; padding: 7px; border-radius: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); font-size: 11px; text-align: center; color: var(--dim); }
    .agent-pill.working { border-color: var(--accent); color: var(--accent); background: rgba(163,113,247,0.06); animation: pulse 2s infinite; }
    .agent-pill.done { border-color: var(--green); color: var(--green); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

    /* Report */
    .report-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .report-head h2 { font-size: 22px; font-weight: 700; }
    .report-head .date { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .score-box { text-align: center; padding: 10px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
    .score-num { font-size: 28px; font-weight: 800; }
    .score-label { font-size: 10px; text-transform: uppercase; color: var(--dim); letter-spacing: 0.05em; }

    .summary-text { font-size: 13px; line-height: 1.7; color: #c9d1d9; margin-bottom: 18px; }

    /* Pillars Grid */
    .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .pillar { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .pillar-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(48,54,61,0.4); font-size: 12px; }
    .stat-label { color: var(--muted); }
    .stat-val { color: var(--text); font-weight: 500; }

    .risk-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .risk-tag { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.2); color: var(--red); }

    /* Agent Table */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px 12px; color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(48,54,61,0.4); }
    .badge-ok { color: var(--green); font-weight: 600; }

    .empty { padding: 50px 20px; text-align: center; color: var(--dim); }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .pillars { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>VentureMind</span> — Multi-Agent Due Diligence</h1>
    <div class="health-pill" id="healthPill"><div class="health-dot"></div><span id="healthText">Ollama Qwen Active</span></div>
  </div>

  <div class="container">
    <div class="layout">
      <!-- Sidebar -->
      <aside>
        <div class="sidebar-title">Past Reports</div>
        <div class="reports-list" id="reportsList"><div style="font-size:12px;color:var(--dim)">Loading…</div></div>
      </aside>

      <!-- Main -->
      <main>
        <!-- Search -->
        <div class="card">
          <div class="card-body">
            <div class="search-row">
              <input type="text" id="startupInput" class="search-input" placeholder="Enter startup name (e.g. Stripe, OpenAI, Datadog)…" autofocus>
              <button class="btn" id="analyzeBtn" onclick="startAnalysis()">▶ Run Diligence</button>
            </div>
            <div class="progress-bar hidden" id="progressBar">
              <div class="agent-pill" id="agMarket">📈 Market</div>
              <div class="agent-pill" id="agComp">⚔️ Competitors</div>
              <div class="agent-pill" id="agFin">💰 Financial</div>
              <div class="agent-pill" id="agLegal">⚖️ Legal</div>
            </div>
          </div>
        </div>

        <!-- Report Content -->
        <div id="reportContent">
          <div class="empty">Select a past report or enter a startup name above to run multi-agent diligence.</div>
        </div>
      </main>
    </div>
  </div>

  <script>
    async function checkHealth() {
      try {
        const r = await fetch('/api/v1/health'), d = await r.json();
        document.getElementById('healthText').textContent = d.status === 'healthy' ? 'Ollama Qwen Online' : 'Degraded';
      } catch(e) {}
    }

    async function loadReports() {
      try {
        const r = await fetch('/api/v1/reports'), d = await r.json();
        const list = document.getElementById('reportsList');
        if (!d.reports || !d.reports.length) { list.innerHTML = '<div style="font-size:12px;color:var(--dim)">No reports yet</div>'; return; }
        list.innerHTML = d.reports.map((rep, i) => `
          <div class="rpt-item${i===0?' active':''}" onclick="selectReport(this,'${esc(rep.startup_name)}')">
            <span>${esc(rep.startup_name)}</span>
            <span class="rpt-score">${rep.investment_score ? rep.investment_score.toFixed(1) : 'N/A'}</span>
          </div>
        `).join('');
        if (d.reports.length) fetchReport(d.reports[0].startup_name);
      } catch(e) {}
    }

    function selectReport(el, name) {
      document.querySelectorAll('.rpt-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      fetchReport(name);
    }

    async function fetchReport(name) {
      try {
        const r = await fetch(`/api/v1/reports/${encodeURIComponent(name)}`);
        if (!r.ok) throw new Error('Not found');
        renderReport(await r.json());
      } catch(e) {}
    }

    function renderReport(r) {
      const c = document.getElementById('reportContent');
      const scoreColor = (r.investment_score||0) >= 7 ? 'var(--green)' : (r.investment_score||0) >= 5 ? 'var(--amber)' : 'var(--red)';
      const m = r.market||{}, comp = r.competitors||{}, f = r.financials||{}, l = r.legal||{};
      const date = r.generated_at ? new Date(r.generated_at).toLocaleDateString(undefined, {month:'short',day:'numeric',year:'numeric'}) : '';

      const risks = (r.risk_flags||[]).map(rf => `<span class="risk-tag">⚠ ${esc(rf)}</span>`).join('') || '<span style="font-size:11px;color:var(--dim)">No critical flags</span>';

      const agents = (r.agent_results||[]).map(a => `<tr><td><strong>${esc(a.agent_name)}</strong></td><td class="badge-ok">✓ ${esc(a.status)}</td><td>${(a.duration_ms/1000).toFixed(2)}s</td><td style="color:var(--muted)">${(a.sources||[]).join(', ')||'Internal'}</td></tr>`).join('');

      const compItems = (comp.competitors||[]).map(c => `<div style="font-size:11px;margin-bottom:4px"><strong>${esc(c.name)}</strong>: ${esc((c.strengths||[]).slice(0,2).join(', '))}</div>`).join('') || '<div style="font-size:11px;color:var(--dim)">No data</div>';

      c.innerHTML = `
        <div class="report-head">
          <div><h2>${esc(r.startup_name)}</h2><div class="date">${date}</div></div>
          <div class="score-box"><div class="score-num" style="color:${scoreColor}">${(r.investment_score||0).toFixed(1)}</div><div class="score-label">Investment Score</div></div>
        </div>
        <div class="card"><div class="card-head" style="color:var(--accent)">Executive Summary</div><div class="card-body"><div class="summary-text">${esc(r.summary)}</div><div class="risk-tags">${risks}</div></div></div>
        <div class="pillars">
          <div class="pillar"><div class="pillar-title">📈 Market</div>
            <div class="stat-row"><span class="stat-label">TAM</span><span class="stat-val">${esc(m.tam_estimate||'N/A')}</span></div>
            <div class="stat-row"><span class="stat-label">CAGR</span><span class="stat-val">${esc(m.cagr_estimate||'N/A')}</span></div>
            <div style="font-size:11px;color:var(--muted);margin-top:6px">${esc(m.market_drivers||'')}</div>
          </div>
          <div class="pillar"><div class="pillar-title">⚔️ Competitors</div>
            <div class="stat-row"><span class="stat-label">Differentiation</span><span class="stat-val">${(comp.differentiation_score||0).toFixed(1)}/10</span></div>
            ${compItems}
          </div>
          <div class="pillar"><div class="pillar-title">💰 Financial</div>
            <div class="stat-row"><span class="stat-label">Burn Rate</span><span class="stat-val">${esc(f.burn_rate_estimate||'N/A')}</span></div>
            <div class="stat-row"><span class="stat-label">Runway</span><span class="stat-val">${esc(f.runway_estimate||'N/A')}</span></div>
            <div class="stat-row"><span class="stat-label">Rounds</span><span class="stat-val">${(f.funding_rounds||[]).length}</span></div>
          </div>
          <div class="pillar"><div class="pillar-title">⚖️ Legal & IP</div>
            <div class="stat-row"><span class="stat-label">Structure</span><span class="stat-val">${esc(l.incorporation_status||'N/A')}</span></div>
            <div class="stat-row"><span class="stat-label">Patents</span><span class="stat-val">${l.patent_count||0}</span></div>
            <div class="stat-row"><span class="stat-label">Trademarks</span><span class="stat-val">${l.trademark_count||0}</span></div>
          </div>
        </div>
        ${agents ? `<div class="card"><div class="card-head">⚡ Agent Telemetry</div><div class="card-body"><table><thead><tr><th>Agent</th><th>Status</th><th>Time</th><th>Sources</th></tr></thead><tbody>${agents}</tbody></table></div></div>` : ''}
      `;
    }

    async function startAnalysis() {
      const name = document.getElementById('startupInput').value.trim();
      if (!name) return;
      const btn = document.getElementById('analyzeBtn');
      const bar = document.getElementById('progressBar');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Analyzing…';
      bar.classList.remove('hidden');
      ['agMarket','agComp','agFin','agLegal'].forEach(id => { document.getElementById(id).className = 'agent-pill working'; });

      try {
        const r = await fetch('/api/v1/analyze', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({startup_name: name}) });
        if (!r.ok) { const e = await r.json(); throw new Error(e.detail||'Failed'); }
        const report = await r.json();
        ['agMarket','agComp','agFin','agLegal'].forEach(id => { const el = document.getElementById(id); el.classList.remove('working'); el.classList.add('done'); });
        renderReport(report);
        await loadReports();
      } catch(e) { alert('Error: ' + e.message); }
      finally {
        btn.disabled = false; btn.innerHTML = '▶ Run Diligence';
        setTimeout(() => bar.classList.add('hidden'), 2000);
      }
    }

    function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
    document.getElementById('startupInput').addEventListener('keydown', e => { if (e.key === 'Enter') startAnalysis(); });
    checkHealth(); loadReports();
  </script>
</body>
</html>
